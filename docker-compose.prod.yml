version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: laboratory_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - laboratory_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/LaboratoryColor.API/Dockerfile
    container_name: laboratory_api_prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - JWT__Secret=${JWT_SECRET}
      - JWT__ValidIssuer=${DOMAIN_URL}
      - JWT__ValidAudience=${DOMAIN_URL}
      - CORS__Origins=${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - laboratory_network
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laboratory-api.rule=Host(`api.${DOMAIN_NAME}`)"
      - "traefik.http.routers.laboratory-api.entrypoints=websecure"
      - "traefik.http.routers.laboratory-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.laboratory-api.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./src/LaboratoryColor.Web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.${DOMAIN_NAME}
    container_name: laboratory_frontend_prod
    depends_on:
      - api
    networks:
      - laboratory_network
      - web 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laboratory-front.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.laboratory-front.entrypoints=websecure"
      - "traefik.http.routers.laboratory-front.tls.certresolver=letsencrypt"
      - "traefik.http.services.laboratory-front.loadbalancer.server.port=80"

volumes:
  postgres_prod_data:

networks:
  laboratory_network:
    driver: bridge
  web:
    external: true
